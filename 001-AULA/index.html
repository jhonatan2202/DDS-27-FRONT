<!-- Especificar que o documento é do tipo HTMl -->
<!DOCTYPE html>

<!-- Especificar o idioma do documento HTML -->
<html lang="pt-br">

<!-- Editar características do arquivo HTML -->
<head>
    <!--Define os caracteres disponiveis na página -->
    <meta charset="UTF-8">
    <!-- Define uma escala incial de visualização -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define o título do documento -->
    <title>Document</title>
</head>

<!-- Editar conteúdo do arquivo HTML -->
<body>
    <!-- Definir um título principal -->
    <h1>Frase Neymar: </h1>
    <p>"Enquanto houver 1% de Chance, haverá 99% de fé."</p>
</body>
</html>
