<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo Input</title>
</head>
<body>
    
    <header>
        <h1>Trabalhando inputs</h1>
    </header>

    <!-- INPUT -->
    <main>
        <h2> Formulário de cadastros</h2>

        <!-- input = coleta informações do usuário -->
        <!-- form = englobar os campos do formulário -->
        <!-- action = para onde a informação vai -->
        <!-- method = forma de como vão as informações -->
        <form action="" method="">

            <!-- label = texto de apoio para guiar o input -->
            <!-- label sem input -->
            <label for="nome_completo"> Nome Completo: </label>
            <!-- text = caracteres em geral -->
            <!-- name = usado para identificar o input quando enviar os dados -->
            <!-- id = identificação daquele elemento html -->
            <input type="text" name="nomeCompleto" id="nome_completo">

            <br><br>
            <!-- input dentro do label -->
            <label>
                Senha: 
                <!-- password = senhas -->
                <input type="password" name="senha" id="senha">
            </label>
        </form>
    </main>


    <footer>
        <p>Direitos meus rapaz , fica esperto</p>
    </footer>
</body>
</html>
