<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apredendo Tabelas</title>
  </head>
  <body>
    <!-- TABELAS -->
    <header>
        <h1>Tabelas aprendizados</h1>
    </header>

    <main>
        <h2> Times de Futebol Brasileiros</h2>
        <!-- Table = criação da tabela -->
        <table border="5px"> 
            <!-- thead = Cabeçalho da tabela -->
            <thead>
                <!-- tr = criação de linha da tabela -->
                <tr>
                    <!-- th = coluna de um cabeçalho -->
                    <th> NOME </th>
                    <th> BRASILEIROS </th>
                    <th> Copas do Brasil </th>
                    <th> Libertadores </th>
                    <th> Mundiais </th>
                </tr>
            </thead>
            <!-- tbody = corpo da tabela -->
            <tbody>
                <!-- td*2>td*5 -->
                <tr>
                    <!-- td = célula da linha do corpo -->
                    <td align="center"> Vasco Da Gama </td>
                    <td align="center">30</td>
                    <td align="center">6</td>
                    <td align="center">10</td>
                    <td align="center">5</td>
                </tr>
                <tr>
                    <td align="center">São Paulo</td>
                    <td align="center">6</td>
                    <td align="center">1</td>
                    <td align="center">3</td>
                    <td align="center">3</td>
                </tr>
                <tr>
                    <td align="center">Palmeiras</td>
                    <td align="center">12</td>
                    <td align="center">3</td>
                    <td align="center">7</td>
                    <td align="center">1</td>
                </tr>
                <tr>
                    <td align="center">Flamengo</td>
                    <td align="center">8</td>
                    <td align="center">5</td>
                    <td align="center">4</td>
                    <td align="center">1</td>
                </tr>
                <tr>
                    <td align="center">Fluminense</td>
                    <td align="center">10</td>
                    <td align="center">9</td>
                    <td align="center">5</td>
                    <td align="center">2</td>
                </tr>
                <tr>
                    <!-- colspan = quantas colunas a celula vai ocupar -->
                    <td colspan="4" align="center">Sport</td>
                    <!-- rowspan = quantas linhas a celula vai ocupar -->
                    <td rowspan="2" align="center"> 5 </td>
                </tr>
                <tr>
                    <td align="center">Abecat</td>
                    <td align="center">25</td>
                    <td align="center">4</td>
                    <td align="center">9</td>

                </tr>

            </tbody>
            <!-- tfoot = rodapé da tabela -->
             <tfoot>
                <tr>
                    <td colspan="5" align="center"> Gabarito feito por: O cara </td>
                </tr>
             </tfoot>
        </table>
    </main>

    <footer>
        <p>Segue ai</p>
    </footer>
  </body>
</html>
